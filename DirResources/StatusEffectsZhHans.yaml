TianziTempHpSe:
  Name: 绝壁
  Description: |-
    独立于生命值上限的额外战斗内生命值，上限 15。
    可连携触发任何与生命值相关的效果。
    受到伤害时优先于|格挡|和|护盾|被扣减。
  Brief: 黄色额外生命值，受击时优先于格挡扣减，上限若干。

TianziRegenSe:
  Name: 自愈
  Description: |-
    {OwnerName}的回合结束时恢复 {Level} 点生命值，回合开始时层数减少 1。
  Brief: "回合结束恢复 {Level} 点生命值。"

TianziWeatherClear:
  Name: 快晴
  Description: |-
    获得本效果时，获得1层|闪避|，并随机获得一点{OwnerName}的基础法力颜色的费用。
    {OwnerName}的|闪避|不会在回合开始时消失。
  Brief: "获得本效果时获得若干层|闪避|与若干点基础色法力；|闪避|不会在回合开始时消失。"

TianziWeatherMist:
  Name: 雾雨
  Description: |-
    {OwnerName}的符卡造成的伤害提升到1.25倍。
  Brief: "符卡造成的伤害提升到若干倍。"

TianziWeatherCloud:
  Name: 云天
  Description: |-
    本效果存在时，每打出1张牌，获得1点无色法力。
  Brief: "每打出一张牌获得若干点无色法力。"

TianziWeatherAzure:
  Name: 苍天
  Description: |-
    回合结束时，{OwnerName}获得7点<sprite="Point" name="Power">。
  Brief: "回合结束时，获得若干点<sprite=\"Point\" name=\"Power\">。"

TianziWeatherHail:
  Name: 雹
  Description: |-
    {OwnerName}每回合结束时，下回合获得与基础法力等量的法力。
  Brief: 下回合获得等量基础法力。

TianziWeatherFog:
  Name: 浓雾
  Description: |-
    {OwnerName}造成未被阻挡的伤害时，会使自身恢复造成伤害量 5% 的生命值。
  Brief: "造成未被阻挡的伤害时，会使自身恢复造成伤害量 5% 的生命值。"

TianziWeatherTyphoon:
  Name: 台风
  Description: |-
    所有敌人无法获得|格挡|或|护盾|。
    立刻清除所有敌人已有的|格挡|和|护盾|。
  Brief: 敌人无法获得|格挡|或|护盾|，并清除已有的。

TianziWeatherSun:
  Name: 烈日
  Description: |-
    {OwnerName}的回合结束时，所有敌人失去最大生命值的 1%。
  Brief: "{OwnerName}的回合结束时，所有敌人失去最大生命值的 1%。"

TianziPeachBoostSe:
  Name: 仙桃增幅
  Description: |-
    {OwnerName}获得|绝壁|时，额外获得1点|绝壁|。
    此能力无法叠加。
  Brief: "获得|绝壁|时额外增加若干。无法叠加。"

TianziPeachGardenSe:
  Name: 漫漫桃源
  Description: |-
    {OwnerName}的|绝壁|减少时，获得1点|绝壁|。
  Brief: "|绝壁|减少时获得若干点|绝壁|。"

TianziScarletRadianceSe:
  Name: 绯想的威光
  Description: |-
    每当一张牌被放逐，对所有敌人造成 {Level} 点攻击伤害。
  Brief: "放逐牌时对所有敌人造成 {Level} 点伤害。"

TianziScarletWaveSe:
  Name: 绯想剑斩波
  Description: |-
    {OwnerName}每回合前 {Level} 次（剩余 {Count} 次）攻击造成伤害时，获得等量的|格挡|。
    此能力无法叠加。
  Brief: "每回合前 {Level} 次（剩 {Count}）攻击伤害转|格挡|。无法叠加。"

TianziKeystoneMatrixSe:
  Name: 石阵
  Description: |-
    接下来 {Duration} 回合内，{OwnerName}每回合开始获得 {Level} 点|格挡|。
  Brief: "回合开始获得 {Level} 点|格挡|。"

TianziNextTurnManaSe:
  Name: 蓄力
  Description: |-
    {OwnerName}下回合开始时获得{Mana}。
  Brief: "下回合获得{Mana}。"

TianziParityKwSe:
  Name: 奇偶数
  Description: |-
    根据手牌张数的奇数 / 偶数触发不同效果。
  Brief: 按手牌张数的奇偶触发效果。

TianziKarmaKwSe:
  Name: 因果
  Description: 根据卡牌种类（攻击 / 防御 / 技能 / 能力 / 厄运与状态）触发不同效果。
  Brief: 按卡牌种类触发效果。

TianziKarmaSe:
  Name: 因果掌控
  Description: 带有|因果|关键字的牌打出时，因果效果改为自行选择触发。
  Brief: 因果效果改为自行选择。

TianziOddEvenSe:
  Name: 天人气性
  Description: |-
    手牌张数的「奇数 / 偶数」分支效果改为由{OwnerName}选择触发。
  Brief: 奇偶分支改为自行选择。

TianziWeatherForecastSe:
  Name: 观测
  Description: "下回合开始时随机释放一种天气，持续 {Duration} 回合。"
  Brief: 下回合开始时释放一种天气。

TianziMeditationSe:
  Name: 一念
  Description: |-
    {OwnerName}每回合多抽1张牌；
    回合开始时，可将一张手牌与弃牌堆内的一张牌互换。
  Brief: "每回合多抽若干张；可互换手牌与弃牌堆。"
TianziEnduranceSe:
  Name: 天人的耐性
  Description: |-
    {OwnerName}回合开始时获得|10|点|格挡|，
    并获得|1|点|灵力|（最多累计3点）。
  Brief: 回合开始获得若干格挡和|灵力|。
TianziPureWishSe:
  Name: 清霖之愿
  Description: |-
    {OwnerName}每回合前 {Level} 次（剩余 {Count} 次）抽到厄运或状态牌时，
    将其放逐并抽1张牌；|庇护|触发时本效果也会生效。
    此能力无法叠加。
  Brief: "每回合前 {Level} 次（剩 {Count}）放逐厄运/状态并补抽。无法叠加。"

TianziHeavenShieldSe:
  Name: 天界之庇护
  Description: |-
    {OwnerName}的回合开始时获得{Mana}。
    {OwnerName}的回合结束时获得|1|层|庇护|。
    此能力无法叠加。
  Brief: "回合开始获得{Mana}，回合结束获得|庇护|。无法叠加。"

TianziMortalJourneySe:
  Name: 凡间之游
  Description: |-
    {OwnerName}每打出 {Level} 张牌，获得{Mana}并抽|1|张牌。
    还需打出 {Count} 张牌。
    此能力无法叠加。
  Brief: "还需 {Count}/{Level} 张牌触发。无法叠加。"

TianziPeachTalismanSe:
  Name: 桃符「固若金汤的仙桃」
  Description: |-
    每四个回合，{OwnerName}获得|1|回合|天衣无缝|，
    并立即获得 {Level} 点|绝壁|。
  Brief: "每若干回合获得|天衣无缝|与|绝壁|。"

TianziHeavenlyTempoSe:
  Name: 天人永不落俗
  Description: |-
    奇数回合开始时获得 {Count} 点|火力|。
    偶数回合开始时获得当前|火力|的 {Level} 倍|格挡|（至多25点）。
  Brief: 奇数|火力|，偶数|格挡|至多若干。
TianziPeachEternitySe:
  Name: “野生桃奶”
  Description: |-
    {OwnerName}的|绝壁|上限提高 {Level}；
    每回合开始获得 {Count} 点|绝壁|。
  Brief: "|绝壁|上限提高，每回合开始获得|绝壁|。"

TianziScarletChargeSe:
  Name: 盈能
  Description: |-
    本回合下一张攻击牌的每次伤害增加 {Level}，本效果将在主角的普通回合结束时消失。
  Brief: "下一张攻击牌每次伤害增加 {Level}，本效果将在主角的普通回合结束时消失。"

TianziPeachReserveSe:
  Name: 桃储
  Description: |-
    {OwnerName}每回合结束时获得|2|点|绝壁|；
    每当累计减少 {Level} 点|绝壁|，获得 {Count} 点|格挡|并抽一张牌。
    每回合最多触发|2|次。
  Brief: 回合结束获得|绝壁|；|绝壁|减少时反哺|格挡|。

TianziNextTurnPhilSe:
  Name: 幻虹
  Description: "{OwnerName}下回合开始时获得{Mana}。"
  Brief: 下回合获得{Mana}。

TianziDoubleAttackSe:
  Name: 三倍度反
  Description: "本回合下一张攻击牌造成原来的|2|倍的伤害。"
  Brief: "下一张攻击造成原来的若干倍伤害。"

TianziShrugSe:
  Name: 耸肩无视
  Description: |-
    {OwnerName}在自己的回合内受到伤害时，获得 {Level} 点|格挡|。
    {OwnerName}的回合结束时，移除本效果。
  Brief: 本回合受伤获得|格挡|，回合结束时消失。

TianziHardshipRetainSe:
  Name: 后乐
  Description: 本回合结束前，保留所有手牌。
  Brief: 回合结束前保留手牌。

TianziProbeSe:
  Name: 气质探查
  Description: "{OwnerName}每打出一张|奇偶数|牌，抽|1|张牌。"
  Brief: 打出奇偶牌时抽牌。

TianziEarthDelaySe:
  Name: 镇石
  Description: "后续 {Count} 个回合开始时，获得 {Level} 层|自愈|。"
  Brief: 后续回合获得|自愈|。

TianziFeastSe:
  Name: 庆功宴
  Description: "每当1名敌人被打败，恢复|2|点生命值，获得{Mana}并抽|1|张牌。"
  Brief: 击杀回血、得费、抽牌。

TianziReflectSe:
  Name: 境界对决
  Description: 完全抵挡下 {Level} 次敌人攻击造成的生命损失，并原额返还。
  Brief: 抵挡并返还下一次攻击。

TianziGraceSe:
  Name: 有顶天的恩宠
  Description: |-
    回合开始失去|格挡|时，将剩余|格挡|转化为|绝壁|。
    每回合开始获得{Mana}。
  Brief: 回合开始|格挡|转为|绝壁|。

TianziLethalSe:
  Name: 极彩辐光
  Description: "{OwnerName}在回合内获得{Mana}时，对所有敌人造成其最大生命值 1% 的伤害。"
  Brief: 获得{Mana}时造成敌人最大生命值百分比伤害。

TianziBossPeachSe:
  Name: 仙桃
  Description: 受到伤害时回复 {Level} 点生命值，并额外积攒 {Count} 点<sprite="Point" name="Power">。
  Brief: 受到伤害时回复生命值并额外积攒<sprite="Point" name="Power">。

TianziBossHeavenQiSe:
  Name: 天人之气
  Description: 回合结束时，负面状态失去|2|层而不是|1|层。
  Brief: 回合结束时，负面状态额外失去层数。

TianziBossKarmaInfluenceSe:
  Name: 因果影响
  Description: |-
    主角每打出 {Level} 张牌时（进度 {Count}/{Level}）：
    这张牌从左数第奇数张：随机失去|1|点费用；第偶数张：随机弃|1|张牌。
  Brief: 每打出 {Level} 张牌，按这张牌的奇偶位置惩罚。
